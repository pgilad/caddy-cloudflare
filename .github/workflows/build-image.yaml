name: Build container image

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-bake.hcl
      - .github/workflows/*.yaml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-bake.hcl
      - .github/workflows/*.yaml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/bake-action@v7.5.0
        with:
          push: false
